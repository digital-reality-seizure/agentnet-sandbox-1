name: spike-s11
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
  checks: write
jobs:
  carry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare patch-ids of the PR's own diff before and after
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE: ${{ github.event.pull_request.base.ref }}
          PRNUM: ${{ github.event.pull_request.number }}
        run: |
          set -u
          git fetch --quiet origin "$BASE" || true
          git fetch --quiet origin "$BEFORE" 2>/dev/null || echo "note: BEFORE not fetchable by sha"
          git fetch --quiet origin "+refs/pull/$PRNUM/head" 2>/dev/null || true
          pid() { mb=$(git merge-base "origin/$BASE" "$1" 2>/dev/null) || return 0; git diff "$mb" "$1" | git patch-id --stable | cut -d' ' -f1; }
          b=$(pid "$BEFORE"); a=$(pid "$AFTER")
          if [ -n "$a" ] && [ -n "$b" ] && [ "$a" = "$b" ]; then c=success; eq=true; else c=failure; eq=false; fi
          jq -n --arg sha "$AFTER" --arg c "$c" --arg s "before=${b:-unavailable} after=${a:-unavailable} equal=$eq" \
            '{name:"agentnet-s11-carry",head_sha:$sha,status:"completed",conclusion:$c,output:{title:"patch-id carry-over",summary:$s}}' \
            | gh api -X POST "repos/$REPO/check-runs" --input -
