name: spike-s12
on:
  workflow_dispatch:
    inputs:
      issue:
        required: true
      who:
        required: true
permissions:
  issues: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment as github-actions[bot]
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          WHO: ${{ inputs.who }}
        run: gh api -X POST "repos/$REPO/issues/$ISSUE/comments" -f body="S12 bot mention for @$WHO"
